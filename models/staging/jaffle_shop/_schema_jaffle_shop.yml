models:
  - name: stg_jaffle_shop__customers
    group: marketing
    access: private
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null             
  - name: stg_jaffle_shop__orders
    group: marketing
    access: private
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - "returned"
                  - "completed"
                  - "return_pending"
                  - "placed"
                  - "shipped"
  - name: stg_jaffle_shop__products
    columns:
      - name: sku
        data_tests:
          - unique
          - not_null
