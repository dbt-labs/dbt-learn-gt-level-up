models:
  - name: stg_jaffle_shop__customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null             
    versions:
     - v: 2
       defined_in: stg_jaffle_shop__customers_v2
     - v: 1
       defined_in: stg_jaffle_shop__customers
       config:
         alias: stg_jaffle_shop__customers
       columns:
         - include: '*'
         - name: last_name
           data_type: string

  - name: stg_jaffle_shop__products
    columns:
      - name: sku
        data_tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders
    group: marketing
    access: protected
    config:
     contract:
       enforced: true
    description: One record per order
    columns:
     - name: status
       data_type: string
       tests:
         - accepted_values:
             values:
               - placed
               - shipped
               - completed
               - returned
               - return_pending
     - name: customer_id
       data_type: int
       constraints:
         - type: not_null
     - name: order_id
       data_type: int
       constraints:
         - type: not_null
       tests:
         - unique
         - not_null
     - name: order_date
       data_type: date
       constraints:
         -  type: not_null
     - name: _etl_loaded_at
       data_type: timestamp
       constraints:
         - type: not_null

