
models:
  - name: stg_jaffle_shop__customers
    config:
      group: finance
      access: protected
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders
    config:
      group: finance
      access: protected
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              values:
                - "returned"
                - "completed"
                - "return_pending"
                - "placed"
                - "shipped"

  - name: stg_jaffle_shop__products
    columns:
      - name: sku
        tests:
          - unique
          - not_null
