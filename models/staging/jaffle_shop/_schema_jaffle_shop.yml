models:
  - name: stg_jaffle_shop__customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null             

  - name: stg_jaffle_shop__products
    columns:
      - name: sku
        data_tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders
    group: marketing
    access: protected
    config:
     contract:
       enforced: true
    description: One record per order
    columns:
     - name: status
       data_type: string
       tests:
         - accepted_values:
             values:
               - placed
               - shipped
               - completed
               - returned
     - name: customer_id
       data_type: int
       constraints:
         - type: not_null
     - name: order_id
       data_type: int
       constraints:
         - type: not_null
       tests:
         - unique
         - not_null
     - name: order_date
       data_type: date
       constraints:
         -  type: not_null
     - name: _etl_loaded_at
       data_type: timestamp
       constraints:
         - type: not_null

