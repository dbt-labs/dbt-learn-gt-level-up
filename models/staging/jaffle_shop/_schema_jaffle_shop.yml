models:
  - name: stg_jaffle_shop__customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null        
          - relationships:
             field: id
             to: source('jaffle_shop', 'customers')
  - name: stg_jaffle_shop__orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - "returned"
                  - "completed"
                  - "return_pending"
                  - "placed"
                  - "shipped"
