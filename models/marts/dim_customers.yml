models:
- name: dim_customers
  group: marketing
  access: public
  description: This model provides a comprehensive view of customer data by combining
    customer details with their order history. It includes information such as the
    customer's first and last name, the date of their first and most recent orders,
    the total number of orders they have placed, and their lifetime value in terms
    of total spending. This model is useful for analyzing customer behavior and value
    over time.
  columns:
  - name: customer_id
    description: A unique identifier for each customer.
  - name: first_name
    description: The first name of the customer.
  - name: last_name
    description: The last name of the customer.
  - name: first_order_date
    description: The date when the customer placed their first order.
  - name: most_recent_order_date
    description: The date when the customer placed their most recent order.
  - name: number_of_orders
    description: The total number of orders placed by the customer.
  - name: lifetime_value
    description: The total amount spent by the customer across all orders.
