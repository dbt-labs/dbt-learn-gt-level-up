models:
  - name: dim_customers
    latest_version: 1
    group: marketing
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: customer_id
        data_type: number
        constraints:
          - type: not_null
      - name: first_name
        data_type: text
      - name: first_order_date
        data_type: date
      - name: last_name
        data_type: text
      - name: lifetime_value
        data_type: number
      - name: most_recent_order_date
        data_type: date
      - name: number_of_orders
        data_type: number
    versions:
      - v: 1
      - v: 2
        columns:
          - include: all
            exclude: [lifetime_value]