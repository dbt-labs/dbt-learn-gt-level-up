
models:
  - name: dim_customers
    group: marketing
    access: public
    config:
     contract:
       enforced: true
    columns:
      - name: customer_id
        data_type: number
        constraints:
          - type: not_null
        description: ""

      - name: first_name
        data_type: varchar
        description: ""

      - name: last_name
        data_type: varchar
        description: ""

      - name: first_order_date
        data_type: date
        description: ""

      - name: most_recent_order_date
        data_type: date
        description: ""

      - name: number_of_orders
        data_type: number
        description: ""

      - name: lifetime_value
        data_type: number
        description: ""
