models:
  - name: dim_customers
    latest_version: 1
    group: marketing
    access: private
    config:
      contract:
        enforced: true
    columns:
      - name: customer_id
        data_type: integer
        constraints:
          - type: primary_key
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_type: string
        data_tests:
          - not_null
      - name: last_name
        data_type: string
        data_tests:
          - not_null
      - name: first_order_date
        data_type: date
      - name: most_recent_order_date
        data_type: date
      - name: number_of_orders
        data_type: integer
      - name: lifetime_value
        data_type: decimal

    versions:
    - v: 1
      config:
        alias: dim_customers
    - v: 2
      columns:
        - name: number_of_orders
          data_type: decimal